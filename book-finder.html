<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anish's Library | Discover Books</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --primary: #38bdf8;
            --accent: #818cf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 12px;
        }

        .motto-banner {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            border: 1px dashed var(--primary);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .search-bar-wrapper {
            display: flex;
            gap: 12px;
            background: var(--surface);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 40px;
        }

        .search-bar-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 1rem;
            padding: 12px 16px;
            font-family: inherit;
        }

        .search-bar-wrapper input::placeholder {
            color: var(--text-muted);
        }

        .search-bar-wrapper button {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #0f172a;
            border: none;
            padding: 0 28px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .search-bar-wrapper button:hover {
            opacity: 0.9;
        }

        .search-bar-wrapper button:active {
            transform: scale(0.98);
        }

        /* Results Grid */
        #results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
        }

        .book-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .book-card:hover {
            transform: translateY(-6px);
            border-color: var(--primary);
            box-shadow: 0 12px 30px rgba(56, 189, 248, 0.15);
        }

        .cover-container {
            height: 240px;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .cover-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .no-cover {
            font-size: 2.5rem;
            color: var(--text-muted);
        }

        .book-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .book-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .book-author {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: auto;
        }

        .state-message {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
            font-size: 1.1rem;
        }

        /* Modal Details Popup */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            padding: 30px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-btn:hover {
            color: var(--text);
        }

        .modal h2 {
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .modal p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 16px;
        }

        .modal a {
            display: inline-block;
            background: var(--primary);
            color: #0f172a;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            #results-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Anish's Library</h1>
            <p class="subtitle">Search millions of books instantly with Anish's Library</p>
            <marquee behavior="alternate" direction="left"><div class="motto-banner">✨ Readers are leaders ✨</div></marquee>
        </header>

        <div class="search-bar-wrapper">
            <input type="text" id="search-input" placeholder="Type a book title or author...">
            <button id="search-btn" onclick="executeSearch()">Explore</button>
        </div>

        <div id="results-grid">
            <div class="state-message">Enter a search term above to begin exploring books.</div>
        </div>
    </div>

    <!-- Details Modal -->
    <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
        <div class="modal" id="modal-content">
            <button class="close-btn" onclick="closeModalForce()">&times;</button>
            <h2 id="modal-title"></h2>
            <p id="modal-author"></p>
            <p id="modal-year"></p>
            <a id="modal-link" href="#" target="_blank">View on Open Library ↗</a>
        </div>
    </div>

    <script>
        document.getElementById("search-input").addEventListener("keypress", (e) => {
            if (e.key === "Enter") executeSearch();
        });

        async function executeSearch() {
            const query = document.getElementById("search-input").value.trim();
            const grid = document.getElementById("results-grid");

            if (!query) return;

            grid.innerHTML = '<div class="state-message">Searching database...</div>';

            try {
                const res = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=12`);
                const data = await res.json();

                grid.innerHTML = "";

                if (!data.docs || data.docs.length === 0) {
                    grid.innerHTML = '<div class="state-message">No books found matching your query.</div>';
                    return;
                }

                data.docs.forEach(book => {
                    const title = book.title || "Untitled";
                    const author = book.author_name ? book.author_name.join(", ") : "Unknown Author";
                    const year = book.first_publish_year || "N/A";
                    const coverId = book.cover_i;
                    const coverUrl = coverId 
                        ? `https://covers.openlibrary.org/b/id/${coverId}-M.jpg` 
                        : null;
                    const openLibraryUrl = `https://openlibrary.org${book.key}`;

                    const card = document.createElement("div");
                    card.className = "book-card";
                    card.onclick = () => openModal(title, author, year, openLibraryUrl);

                    card.innerHTML = `
                        <div class="cover-container">
                            ${coverUrl ? `<img src="${coverUrl}" alt="${title}">` : '<div class="no-cover">📖</div>'}
                        </div>
                        <div class="book-info">
                            <div class="book-title">${title}</div>
                            <div class="book-author">${author}</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (err) {
                grid.innerHTML = '<div class="state-message">An error occurred while fetching books.</div>';
                console.error(err);
            }
        }

        function openModal(title, author, year, url) {
            document.getElementById("modal-title").textContent = title;
            document.getElementById("modal-author").textContent = `Author(s): ${author}`;
            document.getElementById("modal-year").textContent = `First Published: ${year}`;
            document.getElementById("modal-link").href = url;
            document.getElementById("modal-overlay").classList.add("active");
        }

        function closeModal(e) {
            if (e.target.id === "modal-overlay") {
                closeModalForce();
            }
        }

        function closeModalForce() {
            document.getElementById("modal-overlay").classList.remove("active");
        }
    </script>
</body>
</html>
